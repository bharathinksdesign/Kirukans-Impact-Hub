openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /volunteer-enquiries:
    post:
      operationId: createVolunteerEnquiry
      summary: Express interest in volunteering
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VolunteerEnquiryInput" }
      responses:
        "201":
          description: Interest saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryReceipt" }
        "400": { description: "Invalid name, email or consent" }
        "429": { description: Too many submissions }
  /admin/access:
    get:
      operationId: getAdminAccess
      summary: Check signed-in user's inbox access
      responses:
        "200":
          description: Authorized trust administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccess" }
        "401": { description: Sign-in required }
        "403": { description: Administrator access required }
        "503": { description: Inbox access not yet configured }
  /admin/volunteer-enquiries:
    get:
      operationId: getVolunteerInbox
      summary: Private volunteer inbox
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: Newest first, paginated enquiries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryInbox" }
        "401": { description: Sign-in required }
        "403": { description: Administrator access required }
  /admin/volunteer-enquiries/{id}:
    patch:
      operationId: updateEnquiryRead
      summary: Mark a volunteer enquiry as read or unread
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnquiryReadInput" }
      responses:
        "200":
          description: Updated enquiry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolunteerEnquiry" }
        "401": { description: Sign-in required }
        "403": { description: Administrator access required }
        "404": { description: Enquiry not found }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    VolunteerEnquiryInput:
      type: object
      description: Provide at least one valid email or mobile number.
      required: [name, consent]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, pattern: '^\+[1-9][0-9]{6,14}$', maxLength: 16 }
        consent: { type: boolean }
        website: { type: string, maxLength: 200 }
    EnquiryReceipt:
      type: object
      required: [message]
      properties:
        message: { type: string }
    VolunteerEnquiry:
      type: object
      required: [id, name, email, phone, createdAt, readAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
    EnquiryReadInput:
      type: object
      required: [read]
      properties:
        read: { type: boolean }
    EnquiryInbox:
      type: object
      required: [items, total, unreadCount, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/VolunteerEnquiry" }
        total: { type: integer }
        unreadCount: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    AdminAccess:
      type: object
      required: [allowed]
      properties:
        allowed: { type: boolean }

